# Page de démo : podinfo, l'application de démonstration du projet Flux. Son message
# d'accueil vient du Secret lu dans Key Vault.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
  namespace: demo
spec:
  url: https://stefanprodan.github.io/podinfo
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: demo
spec:
  interval: 1h
  chart:
    spec:
      chart: podinfo
      version: 6.17.0
      sourceRef:
        kind: HelmRepository
        name: podinfo
  values:
    extraEnvs:
      - name: PODINFO_UI_MESSAGE
        valueFrom:
          secretKeyRef:
            name: demo-greeting
            key: message
    # Exigé par la policy ALZ Deny-Priv-Esc-AKS (Gatekeeper), absent des valeurs par défaut.
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: demo
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: https-hello
  hostnames:
    - hello.${DNS_ZONE}
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
