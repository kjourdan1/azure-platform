# Le chemin d'un secret, de bout en bout, rendu visible sur la page de démo :
#   générateur (cluster) → PushSecret → Key Vault → ExternalSecret → Secret → pod.
# 1. Valeur générée une seule fois par cluster (refreshInterval 0).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: demo-greeting
  namespace: demo
spec:
  length: 16
  digits: 4
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-greeting-seed
  namespace: demo
spec:
  refreshInterval: "0"
  target:
    name: demo-greeting-seed
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: demo-greeting
---
# 2. Écriture dans Key Vault. contentType et date d'expiration (≤ 90 jours) sont exigés par
# la policy ALZ Enforce-GR-KeyVault ; la date vient de Terraform (time_rotating).
# Replace : chaque nouveau cluster réécrit la valeur et repousse l'expiration.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: demo-greeting
  namespace: demo
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: azure-key-vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: demo-greeting-seed
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: demo-greeting
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          contentType: text/plain
          expirationDate: "${SECRET_EXPIRES_AT}"
          # Pas de tag managed-by : ESO le réserve et le pose lui-même (il s'en sert pour
          # savoir quels secrets il a le droit de remplacer) ; le déclarer fait échouer l'écriture.
---
# 3. Relecture depuis Key Vault : c'est ce Secret, et non la graine, que l'application
# consomme. Key Vault reste la source de vérité.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-greeting
  namespace: demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: demo-greeting
  data:
    - secretKey: message
      remoteRef:
        key: demo-greeting
