# Routage par chemin vers les trois services. Deux routes : le chat a sa propre limite de
# débit et un délai long (réponses en streaming).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  namespace: ai-gateway
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: https-ai
  hostnames:
    - ai.${DNS_ZONE}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/cost
      backendRefs:
        - name: cost-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
  namespace: ai-gateway
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: https-ai
  hostnames:
    - ai.${DNS_ZONE}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/chat
      timeouts:
        request: 120s
      backendRefs:
        - name: chat-api
          port: 80
