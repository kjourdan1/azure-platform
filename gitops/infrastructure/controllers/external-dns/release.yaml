# Enregistrements DNS de la sous-zone lab, tirés des hostnames des HTTPRoute : l'IP de la
# Gateway change à chaque lab-up, le DNS suit sans intervention.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: external-dns
spec:
  url: https://kubernetes-sigs.github.io/external-dns
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  dependsOn:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
  values:
    provider:
      name: azure
    sources:
      - gateway-httproute
    domainFilters:
      - ${DNS_ZONE}
    # sync : supprime aussi les enregistrements dont la route a disparu. Le registre TXT
    # limite ce droit aux enregistrements créés par ce cluster.
    policy: sync
    txtOwnerId: aks-azpl
    serviceAccount:
      name: external-dns # sujet du credential fédéré : external-dns:external-dns
      annotations:
        azure.workload.identity/client-id: ${EXTERNAL_DNS_CLIENT_ID}
    podLabels:
      azure.workload.identity/use: "true"
    extraVolumes:
      - name: azure-config
        secret:
          secretName: external-dns-azure
    extraVolumeMounts:
      - name: azure-config
        mountPath: /etc/kubernetes
        readOnly: true
