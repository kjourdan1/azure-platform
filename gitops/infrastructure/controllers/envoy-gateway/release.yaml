# Implémentation Gateway API (remplaçant d'Ingress) : le contrôleur crée un déploiement
# Envoy et un Service LoadBalancer par Gateway. Le chart installe aussi les CRD Gateway API,
# dont cert-manager a besoin au démarrage.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoyproxy
  namespace: flux-system
spec:
  type: oci
  url: oci://docker.io/envoyproxy
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: envoy-gateway-system
  releaseName: envoy-gateway
  chart:
    spec:
      chart: gateway-helm
      version: v1.9.3
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
