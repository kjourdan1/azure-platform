# Certificats Let's Encrypt. Le support Gateway API n'est vérifié qu'au démarrage : la
# release attend Envoy Gateway, qui installe les CRD Gateway API.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  url: https://charts.jetstack.io
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  dependsOn:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    crds:
      enabled: true
    config:
      gatewayAPI:
        enabled: true
