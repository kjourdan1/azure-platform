# Accès au Key Vault du cluster pour tous les namespaces, via l'identité external-secrets
# (Workload Identity, rôle Key Vault Secrets Officer posé dans lz-aks).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${KEY_VAULT_URL}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
