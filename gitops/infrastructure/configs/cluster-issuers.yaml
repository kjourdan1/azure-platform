# Autorités Let's Encrypt. Challenge HTTP-01 servi par la Gateway : cert-manager crée une
# HTTPRoute temporaire pour /.well-known/acme-challenge/ sur le listener HTTP.
# staging : certificats non reconnus par les navigateurs, sans la limite de 5 émissions
# identiques par semaine de la prod ; à utiliser pour les essais répétés.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: platform
                namespace: gateway
                kind: Gateway
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: platform
                namespace: gateway
                kind: Gateway
                sectionName: http
