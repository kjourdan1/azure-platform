# Point d'entrée unique du cluster : un Service LoadBalancer (une IP publique), un listener
# HTTPS par nom exposé. L'annotation cert-manager crée un certificat par listener HTTPS.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # Un listener par application exposée : le nom d'hôte fixe le certificat émis.
    - name: https-hello
      protocol: HTTPS
      port: 443
      hostname: hello.${DNS_ZONE}
      tls:
        mode: Terminate
        certificateRefs:
          - name: hello-tls
      allowedRoutes:
        namespaces:
          from: All
---
# Tout le HTTP part en HTTPS. Le challenge ACME (/.well-known/acme-challenge/...) reste
# servi en HTTP : la route que crée cert-manager est plus spécifique et passe en priorité.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
