name: terraform-apply

# Couches permanentes uniquement. Le cluster (infra/aks) ne s'applique que par lab-up :
# un merge ne doit pas recréer, et facturer, un cluster détruit par lab-down.
# Le bootstrap (infra/bootstrap) est volontairement exclu : il crée les identités de la CI
# et leurs droits. Il s'applique en local, après revue du plan sur PR, jamais par la CI.
on:
  push:
    branches: [main]
    paths:
      - "infra/landing-zone/**"
      - "infra/platform/**"
      - "infra/lz-aks/**"
      - ".github/workflows/terraform-apply.yml"
      - ".github/workflows/terraform-apply-reusable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    uses: ./.github/workflows/terraform-apply-reusable.yml
    with:
      roots: '["infra/landing-zone", "infra/platform", "infra/lz-aks"]'
    secrets: inherit
    permissions:
      contents: read
      actions: read
      id-token: write
