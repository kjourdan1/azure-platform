name: apply-ai

# Une stack, un pipeline : seul un changement dans infra/ai déclenche cet apply, avec sa
# propre approbation (environnement prd). Le job partagé porte les garde-fous communs.
# Changement du seul workflow : pas d'apply automatique, lancement manuel si besoin.
on:
  push:
    branches: [main]
    paths:
      - "infra/ai/**"
      - "!infra/ai/**/*.md" # la documentation seule ne déclenche pas d'apply
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    uses: ./.github/workflows/terraform-apply-reusable.yml
    with:
      roots: '["infra/ai"]'
    secrets: inherit
    permissions:
      contents: read
      actions: read
      id-token: write
